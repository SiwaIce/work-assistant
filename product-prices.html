<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ราคาสินค้า</title>
<link rel="icon" href="data:,">
<!-- ไม่ใช้ defer: สคริปต์ inline ท้ายไฟล์ไม่มี src จึง defer ไม่มีผล (เบราว์เซอร์รันทันทีตามลำดับที่ parse ถึง)
     ทำให้ inline script รันก่อน firebase-*-compat.js ที่ defer ไว้เสมอ -> firebase is not defined ทุกครั้ง
     (บั๊กเดิมตั้งแต่สร้างไฟล์นี้ครั้งแรก) โหลดแบบ blocking ตรงๆ แทน ไฟล์เล็ก ไม่กระทบความเร็วที่สัมผัสได้ -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --border:#2a2e38; --text:#eef0f3; --text2:#9aa1ad;
    --accent:#3b82f6; --accent-fg:#ffffff; --warn:#fbbf24; --warnbg:#3a2e0f; --chip:#232733;
    --good:#4ade80;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;}
  button{font-family:inherit}
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--border)}
  .h-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  header h1{font-size:15px;margin:0;display:flex;align-items:center;gap:6px;font-weight:700}
  .btn{border:1px solid var(--border);background:var(--chip);color:var(--text);border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .btn.ghost{background:transparent}
  .btn:active{opacity:.8}
  .btn:disabled{opacity:.6}
  .search-row{display:flex;gap:6px}
  .search-row input{flex:1;min-width:0;background:var(--chip);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);font-size:14px}
  .search-row input:focus{outline:none;border-color:var(--accent)}
  .filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--chip);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12.5px;color:var(--text2);white-space:nowrap;cursor:pointer}
  .chip.active{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  main{padding:10px 12px 24px}
  main.has-bar{padding-bottom:150px}
  .count{font-size:12px;color:var(--text2);margin:8px 2px 10px;display:flex;justify-content:space-between;align-items:center}
  .count .sel{color:var(--accent);font-weight:700}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;position:relative;transition:border-color .15s}
  .card.picked{border-color:var(--accent)}
  .card-top{display:flex;gap:8px;align-items:flex-start}
  .chk{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:2px solid var(--border);background:var(--chip);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--accent-fg);cursor:pointer;margin-top:1px}
  .chk.on{background:var(--accent);border-color:var(--accent)}
  .card-main{flex:1;min-width:0}
  .name-row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .name{font-size:14px;font-weight:700;line-height:1.35}
  .sku{font-size:11px;color:var(--text2);margin-top:2px;display:flex;align-items:center;gap:5px}
  .sku-copy{background:none;border:none;color:var(--text2);font-size:12px;padding:0 2px;cursor:pointer;line-height:1}
  .sku-copy.done{color:var(--good)}
  .cat{font-size:10.5px;background:var(--chip);color:var(--text2);padding:2px 7px;border-radius:6px;flex:0 0 auto;white-space:nowrap}
  .cat-select{font-size:10.5px;background:var(--chip);color:var(--text2);padding:2px 18px 2px 7px;border-radius:6px;flex:0 0 auto;white-space:nowrap;border:1px solid var(--border);-webkit-appearance:none;appearance:none;font-family:inherit}
  .eol-badge{font-size:10px;background:#3a1414;color:#f87171;padding:2px 7px;border-radius:6px;margin-left:6px}
  .save-toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--accent);color:var(--accent-fg);font-size:12.5px;padding:8px 14px;border-radius:8px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
  .save-toast.show{opacity:1}
  .prices{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .ptag{flex:1;min-width:72px;background:var(--chip);border-radius:8px;padding:6px 8px;text-align:center}
  .ptag .lv{font-size:10px;color:var(--text2)}
  .ptag .val{font-size:13px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
  .rrp{font-size:11.5px;color:var(--text2);margin-top:8px;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
  .rrp b{color:var(--text)}
  .card-foot{display:flex;justify-content:flex-end;margin-top:8px}
  .copy-one{display:flex;align-items:center;gap:5px;background:none;border:none;color:var(--accent);font-size:12px;font-weight:600;padding:4px 2px;cursor:pointer}
  .copy-one.done{color:var(--good)}
  .empty{text-align:center;padding:40px 10px;color:var(--text2);font-size:13px}
  .gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
  .gate .logo{font-size:40px}
  .gate h2{margin:0;font-size:17px}
  .gate p{margin:0;color:var(--text2);font-size:13px;max-width:280px}
  .gate .err{color:#f87171;font-size:12.5px}
  .gate input{width:200px;text-align:center;font-size:18px;letter-spacing:4px;background:var(--chip);border:1px solid var(--border);
    border-radius:9px;padding:10px 12px;color:var(--text)}
  .gate input:focus{outline:none;border-color:var(--accent)}
  .spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--border);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -6px 18px -8px rgba(0,0,0,.4); display:none}
  .bar.show{display:block}
  .bar-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
  .bar-row::-webkit-scrollbar{display:none}
  .bar-row .lbl{font-size:10.5px;color:var(--text2);flex:0 0 auto;align-self:center;padding-right:2px}
  .bar-actions{display:flex;gap:8px;align-items:center}
  .fmt-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:0 0 auto}
  .fmt-toggle button{border:none;background:var(--chip);color:var(--text2);font-size:12px;padding:8px 10px;cursor:pointer;font-weight:600}
  .fmt-toggle button.on{background:var(--accent);color:var(--accent-fg)}
  .bar-actions .btn.primary{flex:1}
  [hidden]{display:none!important}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="logo">🔒</div>
  <h2>ราคาสินค้า</h2>
  <p>หน้าดูราคาสินค้าแบบเบา ใส่รหัสผ่านทีมเพื่อเข้าดู (ไม่ต้อง login Google)</p>
  <input id="pinInput" type="password" inputmode="numeric" placeholder="รหัสผ่าน" onkeydown="if(event.key==='Enter')attemptUnlock()">
  <button class="btn primary" id="unlockBtn" onclick="attemptUnlock()">🔓 เข้าดูราคา</button>
  <div class="err" id="gateErr" hidden></div>
</div>

<div id="app" hidden>
<header>
  <div class="h-row">
    <h1>⚡ ราคาสินค้า</h1>
    <div style="display:flex;gap:6px">
      <button class="btn" id="selToggleBtn" onclick="toggleSelectMode()">☑️ เลือกหลายชิ้น</button>
      <button class="btn ghost" onclick="changePin()" title="เปลี่ยนรหัสผ่าน">🔑</button>
      <button class="btn ghost" onclick="lockAgain()" title="ล็อกหน้าใหม่">🔒</button>
    </div>
  </div>
  <div class="search-row">
    <input id="q" type="text" placeholder="🔍 ค้นหาชื่อ / SKU" oninput="render()">
  </div>
  <div class="filters" id="catFilters"></div>
</header>

<main id="mainEl">
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>
</div>

<div class="bar" id="bar">
  <div class="bar-row" id="levelChips"></div>
  <div class="bar-actions">
    <div class="fmt-toggle" id="fmtToggle"></div>
    <button class="btn ghost" onclick="clearSelection()">ยกเลิก</button>
    <button class="btn primary" id="copyBtn" onclick="copySelected()">📋 คัดลอก (<span id="selCount">0</span>)</button>
  </div>
</div>
<div class="save-toast" id="saveToast"></div>

<script>
// แยกจากแอพหลักโดยตั้งใจ — โหลดแค่ Firebase SDK (เฉพาะ firestore ไม่ใช้ auth เลย) กับสคริปต์นี้ไฟล์เดียว
// ไม่พ่วง utils.js/storage.js/views-*.js/app.js ของแอพหลัก เพื่อให้เปิดเร็วบนมือถือ/เน็ตช้า
//
// ไม่ login Google (signInWithPopup ค้างบ่อยบนเบราว์เซอร์มือถือ/in-app browser) ใช้ PIN gate แบบเดียวกับ
// demo-staff.html แทน (เก็บ pinHash ไว้ที่ dealerUpdates/productPricesAuth ซึ่งเปิด read/write:true อยู่แล้ว
// ตาม firestore.rules ข้อ 2 — เป็น soft gate กันเผลอ ไม่ใช่ความปลอดภัยจริง เหมือนที่ demo-staff ใช้)
//
// อ่านข้อมูลจาก guestViewData/{uid}/products/_data ซึ่งแอพหลัก sync ให้อัตโนมัติอยู่แล้วทุกครั้งที่
// แก้ไข/บันทึก/ดึงสินค้า (ดู _publishGuestViewProducts ใน products.js) — collection นี้เปิด read:true
// สำหรับทุกคนตาม firestore.rules ข้อ 8 (Guest View) จึงไม่ต้อง login เพื่ออ่าน
// ต้องมาจากลิงก์ที่มี ?u=<uid> (กดจากเมนูในแอพหลักให้อัตโนมัติ) ถ้าไม่มี uid จะไม่รู้ว่าจะอ่านของใคร
firebase.initializeApp({
  apiKey: "AIzaSyB_qYvFINwOehVQ1Y6UJW9bHRL1iYcyM7w",
  authDomain: "work-assistant-9e024.firebaseapp.com",
  projectId: "work-assistant-9e024",
  storageBucket: "work-assistant-9e024.firebasestorage.app",
  messagingSenderId: "796607223436",
  appId: "1:796607223436:web:1455abe90b141104678da9"
});
var db = firebase.firestore();

// เก็บ uid ที่เคยใช้สำเร็จไว้ใน localStorage เสมอ — ถ้าเปิดหน้านี้จากแท็บ/บุ๊กมาร์กเก่าที่ไม่มี ?u= แนบมา
// (เช่น เปิดจากประวัติเบราว์เซอร์ หรือ PWA เปิดแท็บเดิมซ้ำแทนที่จะเปิดแท็บใหม่ตาม URL ที่ส่งไป) จะได้ยังใช้ได้
// โดยไม่ต้องกลับไปกดปุ่มในแอพหลักใหม่ทุกครั้ง
var OWNER_UID_KEY = 'productPricesOwnerUid';
var OWNER_UID = new URLSearchParams(location.search).get('u') || '';
if (OWNER_UID) {
  try { localStorage.setItem(OWNER_UID_KEY, OWNER_UID); } catch(e) {}
} else {
  try { OWNER_UID = localStorage.getItem(OWNER_UID_KEY) || ''; } catch(e) {}
}
// ถ้าไม่มีทั้ง ?u= และ localStorage (เช่น เปิดลิงก์เปล่าๆ/บุ๊กมาร์กที่ไม่เคยมี uid มาก่อน) ลองอ่าน uid ของ
// เจ้าของจาก dealerUpdates/productPricesAuth.ownerUid ซึ่งแอพหลัก publish ไว้ให้อัตโนมัติทุกครั้งที่ login
// (ดู _publishGuestViewProducts ใน products.js) — ทำให้หน้านี้เข้าได้ด้วย PIN อย่างเดียว ไม่ต้องพึ่งลิงก์จาก
// แอพหลักเลย (แอพนี้มีผู้ใช้คนเดียวจึงไม่ต้องกังวลว่าจะได้ uid ผิดคน)
function resolveOwnerUid() {
  if (OWNER_UID) return Promise.resolve(OWNER_UID);
  return db.collection('dealerUpdates').doc('productPricesAuth').get().then(function(doc) {
    var uid = (doc.exists && doc.data().ownerUid) || '';
    if (uid) {
      OWNER_UID = uid;
      try { localStorage.setItem(OWNER_UID_KEY, OWNER_UID); } catch(e) {}
    }
    return OWNER_UID;
  }).catch(function() { return OWNER_UID; });
}
var PIN_OK_KEY = 'productPricesPinOk';
var PIN_OK_DAYS = 30;

var PRODUCT_CATEGORIES = [
  { id: 'drone', name: '🚁 Drone' },
  { id: 'payload', name: '📷 Payload' },
  { id: 'battery', name: '🔋 Battery' },
  { id: 'charger', name: '⚡ Charger/Accessory' },
  { id: 'software', name: '💻 Software' },
  { id: 'service', name: '🛠️ Service' },
  { id: 'bundle', name: '🎁 Bundle' },
  { id: 'demo', name: '🎪 Demo Unit' },
  { id: 'demo_accessory', name: '🔧 Demo Accessory' },
  { id: 'other', name: '📦 Other' }
];
function categoryName(id) {
  var c = PRODUCT_CATEGORIES.find(function(x) { return x.id === id; });
  return c ? c.name : '📦 Other';
}
function categorySelectHtml(p) {
  var opts = PRODUCT_CATEGORIES.map(function(c) {
    return '<option value="'+c.id+'"'+(p.category===c.id?' selected':'')+'>'+c.name+'</option>';
  }).join('');
  return '<select class="cat-select" onchange="changeCategory(\''+p.id+'\', this.value)">'+opts+'</select>';
}
function showSaveToast(msg) {
  var el = document.getElementById('saveToast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(function(){ el.classList.remove('show'); }, 2000);
}
// แก้ "หมวดสินค้า" จากหน้านี้ไม่มี auth เขียนเข้า guestViewData/{uid} (เจ้าของเท่านั้นเขียนได้ ตาม
// firestore.rules ข้อ 8) หรือ users/{uid}/products จริงตรงๆไม่ได้เลย — พักคำขอแก้ไว้ที่
// dealerUpdates/productPricesCategoryEdits ซึ่งเปิด read/write:true อยู่แล้ว (รูปแบบเดียวกับ
// publicDemoEdits ของหน้า demo) แอพหลักจะดึงไปใช้จริงกับ users/{uid}/products แล้วเคลียร์คิวทุกครั้งที่
// sync จาก cloud (ดู _applyPendingCategoryEditsFromLitePage ใน products.js) — apply อัตโนมัติไม่ต้องกด
// "รับเข้า" เหมือนหน้า demo เพราะคนแก้คือเจ้าของแอปเอง ไม่ใช่ลูกค้า/บุคคลอื่น
function changeCategory(id, newCat) {
  var p = byId(id);
  if (!p || p.category === newCat) return;
  var oldCat = p.category;
  p.category = newCat;
  renderFilters();
  render();
  var edits = {};
  edits[id] = newCat;
  db.collection('dealerUpdates').doc('productPricesCategoryEdits').set({ edits: edits }, { merge: true })
    .then(function() { showSaveToast('✅ บันทึกหมวดแล้ว — จะอัพเดตในแอพหลักรอบถัดไปที่เปิด'); })
    .catch(function(e) {
      p.category = oldCat;
      renderFilters();
      render();
      alert('⚠️ บันทึกไม่สำเร็จ: ' + (e && e.message ? e.message : ''));
    });
}

var LEVELS = [
  {id:"rrpInVat", label:"RRP รวม Vat"},
  {id:"rrpExVat", label:"RRP Ex Vat"},
  {id:"S", label:"ราคา S"},
  {id:"A", label:"ราคา A"},
  {id:"B", label:"ราคา B"},
  {id:"Other", label:"ราคา Other"}
];

var PRODUCTS = [];
var activeCat = "all";
var selectMode = false;
var selected = {};
var selectedLevels = {rrpInVat:true, rrpExVat:true, S:true, A:true, B:true, Other:true};
var copyFormat = "text";

function fmt(n){ return (n || 0).toLocaleString('th-TH'); }
function byId(id){ for (var i=0;i<PRODUCTS.length;i++) if (PRODUCTS[i].id===id) return PRODUCTS[i]; return null; }
function levelVal(p, levelId) {
  if (levelId === 'rrpInVat') return p.rrpInVat || 0;
  if (levelId === 'rrpExVat') return p.rrpExVat || 0;
  return (p.typePrices && p.typePrices[levelId]) || 0;
}
async function sha256(str) {
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.prototype.map.call(new Uint8Array(buf), function(b) { return b.toString(16).padStart(2,'0'); }).join('');
}

// ---------- PIN gate ----------
function showGateErr(msg) {
  var el = document.getElementById('gateErr');
  el.textContent = msg;
  el.hidden = false;
}
function lockAgain() {
  try { localStorage.removeItem(PIN_OK_KEY); } catch(e) {}
  location.reload();
}
function changePin() {
  var cur = prompt('ใส่รหัสเดิมเพื่อยืนยัน:');
  if (cur === null) return;
  cur = cur.trim();
  if (!cur) { alert('กรุณาใส่รหัสเดิม'); return; }
  db.collection('dealerUpdates').doc('productPricesAuth').get().then(function(doc) {
    var storedHash = doc.exists ? doc.data().pinHash : null;
    return sha256(cur).then(function(h) {
      if (!storedHash || h !== storedHash) { alert('❌ รหัสเดิมไม่ถูกต้อง'); return; }
      var next = prompt('ตั้งรหัสใหม่:');
      if (next === null) return;
      next = next.trim();
      if (!next) { alert('กรุณาใส่รหัสใหม่'); return; }
      return sha256(next).then(function(h2) {
        return db.collection('dealerUpdates').doc('productPricesAuth').set({ pinHash: h2 });
      }).then(function() { alert('✅ เปลี่ยนรหัสเรียบร้อย'); });
    });
  }).catch(function(e) {
    alert('⚠️ เชื่อมต่อไม่สำเร็จ: ' + (e && e.message ? e.message : ''));
  });
}
function attemptUnlock() {
  var pin = document.getElementById('pinInput').value.trim();
  var btn = document.getElementById('unlockBtn');
  document.getElementById('gateErr').hidden = true;
  if (!pin) { showGateErr('กรอกรหัสผ่านก่อนนะครับ'); return; }
  btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
  resolveOwnerUid().then(function(uid) {
  if (!uid) {
    showGateErr('❌ ยังไม่มีข้อมูลเจ้าของลิงก์นี้ — กรุณาเปิดแอพหลัก เข้าเมนู "สินค้าทั้งหมด" สักครั้งเพื่อซิงก์ข้อมูล แล้วลองใหม่');
    btn.disabled = false; btn.textContent = '🔓 เข้าดูราคา';
    return;
  }
  db.collection('dealerUpdates').doc('productPricesAuth').get().then(function(doc) {
    if (!doc.exists || !doc.data().pinHash) {
      if (!confirm('ยังไม่เคยตั้งรหัสผ่านสำหรับหน้านี้ ต้องการตั้งรหัส "' + pin + '" เป็นรหัสผ่านเลยไหม?')) {
        btn.disabled = false; btn.textContent = '🔓 เข้าดูราคา';
        return;
      }
      return sha256(pin).then(function(h) {
        return db.collection('dealerUpdates').doc('productPricesAuth').set({ pinHash: h });
      }).then(function() { unlockSuccess(); });
    }
    return sha256(pin).then(function(h) {
      if (h === doc.data().pinHash) { unlockSuccess(); }
      else {
        showGateErr('❌ รหัสผ่านไม่ถูกต้อง');
        btn.disabled = false; btn.textContent = '🔓 เข้าดูราคา';
      }
    });
  }).catch(function(e) {
    showGateErr('⚠️ เชื่อมต่อไม่สำเร็จ: ' + (e && e.message ? e.message : ''));
    btn.disabled = false; btn.textContent = '🔓 เข้าดูราคา';
  });
  });
}
function unlockSuccess() {
  try { localStorage.setItem(PIN_OK_KEY, String(Date.now() + PIN_OK_DAYS * 86400000)); } catch(e) {}
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
  loadProducts();
}
function checkStoredPin() {
  try {
    var v = localStorage.getItem(PIN_OK_KEY);
    if (v && Number(v) > Date.now()) { resolveOwnerUid().then(unlockSuccess); return true; }
  } catch(e) {}
  return false;
}

// ---------- Data ----------
function loadProducts() {
  document.getElementById('list').innerHTML = '<div class="empty"><div class="spin" style="margin:0 auto 10px"></div>กำลังโหลดรายการสินค้า…</div>';
  db.collection('guestViewData').doc(OWNER_UID).collection('products').doc('_data').get().then(function(doc) {
    if (!doc.exists || !doc.data().value) {
      document.getElementById('list').innerHTML = '<div class="empty">ยังไม่มีข้อมูลสินค้าสำหรับลิงก์นี้ — กรุณาเปิดแอพหลัก เข้าเมนู "สินค้าทั้งหมด" แล้วบันทึก/แก้ไขสินค้าใดๆ สักครั้งเพื่อซิงก์ข้อมูล แล้วลองใหม่</div>';
      return;
    }
    PRODUCTS = doc.data().value || [];
    renderFilters();
    render();
  }).catch(function(err) {
    document.getElementById('list').innerHTML = '<div class="empty">❌ โหลดรายการสินค้าไม่สำเร็จ: ' + (err && err.message ? err.message : '') + '</div>';
  });
}

// ---------- UI: filters / select mode ----------
function renderFilters(){
  var cats = {};
  PRODUCTS.forEach(function(p){ if (p.category) cats[p.category] = true; });
  var list = [{id:'all', name:'📂 ทุกหมวด'}].concat(
    Object.keys(cats).map(function(id){ return {id:id, name:categoryName(id)}; })
  );
  var el = document.getElementById('catFilters');
  el.innerHTML = list.map(function(c){
    return '<div class="chip'+(c.id===activeCat?' active':'')+'" onclick="setCat(\''+c.id+'\')">'+c.name+'</div>';
  }).join('');
}
function setCat(id){ activeCat = id; renderFilters(); render(); }

function toggleSelectMode(){
  selectMode = !selectMode;
  var btn = document.getElementById('selToggleBtn');
  btn.textContent = selectMode ? '✖️ ออกจากโหมดเลือก' : '☑️ เลือกหลายชิ้น';
  btn.className = selectMode ? 'btn primary' : 'btn';
  if (!selectMode) selected = {};
  render();
}
function clearSelection(){ selected = {}; render(); }
function toggleOne(id, ev){
  if (ev) ev.stopPropagation();
  if (selected[id]) delete selected[id]; else selected[id] = true;
  render();
}
function toggleLevel(id){ selectedLevels[id] = !selectedLevels[id]; renderLevelChips(); }
function setFormat(f){ copyFormat = f; renderFmtToggle(); }

function renderLevelChips(){
  var el = document.getElementById('levelChips');
  el.innerHTML = '<span class="lbl">คัดลอกข้อมูล:</span>' + LEVELS.map(function(l){
    return '<div class="chip'+(selectedLevels[l.id]?' active':'')+'" onclick="toggleLevel(\''+l.id+'\')">'+l.label+'</div>';
  }).join('');
}
function renderFmtToggle(){
  var el = document.getElementById('fmtToggle');
  el.innerHTML =
    '<button class="'+(copyFormat==='text'?'on':'')+'" onclick="setFormat(\'text\')">📝 ข้อความ</button>' +
    '<button class="'+(copyFormat==='table'?'on':'')+'" onclick="setFormat(\'table\')">📊 ตาราง</button>';
}
function activeLevelList(){ return LEVELS.filter(function(l){ return selectedLevels[l.id]; }); }

// ---------- Copy ----------
function productLines(p, levels){
  return levels.map(function(l){ return l.label + ': ' + fmt(levelVal(p, l.id)) + ' บาท'; });
}
function oneItemText(p){
  var levels = activeLevelList();
  return [p.name, 'SKU: ' + (p.sku || '-')].concat(productLines(p, levels)).join('\n');
}
function buildTextBlock(products){
  var levels = activeLevelList();
  return products.map(function(p){
    return [p.name, 'SKU: ' + (p.sku || '-')].concat(productLines(p, levels)).join('\n');
  }).join('\n\n');
}
function buildTableBlock(products){
  var levels = activeLevelList();
  var header = ['ชื่อสินค้า', 'SKU'].concat(levels.map(function(l){ return l.label; }));
  var rows = [header.join('\t')];
  products.forEach(function(p){
    var row = [p.name, p.sku || '-'].concat(levels.map(function(l){ return fmt(levelVal(p, l.id)); }));
    rows.push(row.join('\t'));
  });
  return rows.join('\n');
}
function doCopy(text, onDone){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(onDone, function(){ fallbackCopy(text, onDone); });
  } else {
    fallbackCopy(text, onDone);
  }
}
function fallbackCopy(text, onDone){
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  } catch(e) {}
  if (onDone) onDone();
}
function copyOne(id, ev){
  if (ev) ev.stopPropagation();
  var p = byId(id);
  if (!p) return;
  doCopy(oneItemText(p), function(){
    var el = document.getElementById('copyOne-' + id);
    if (!el) return;
    var old = el.innerHTML;
    el.innerHTML = '✅ คัดลอกแล้ว';
    el.classList.add('done');
    setTimeout(function(){ el.innerHTML = old; el.classList.remove('done'); }, 1400);
  });
}
function copySku(id, ev){
  if (ev) ev.stopPropagation();
  var p = byId(id);
  if (!p || !p.sku) return;
  doCopy(p.sku, function(){
    var el = document.getElementById('skuCopy-' + id);
    if (!el) return;
    var old = el.innerHTML;
    el.innerHTML = '✅';
    el.classList.add('done');
    setTimeout(function(){ el.innerHTML = old; el.classList.remove('done'); }, 1200);
  });
}
function copySelected(){
  var ids = Object.keys(selected);
  if (!ids.length) return;
  var products = ids.map(byId).filter(Boolean);
  var text = copyFormat === 'table' ? buildTableBlock(products) : buildTextBlock(products);
  doCopy(text, function(){
    var btn = document.getElementById('copyBtn');
    var old = btn.innerHTML;
    btn.innerHTML = '✅ คัดลอกแล้ว';
    setTimeout(function(){ btn.innerHTML = old; }, 1400);
  });
}

// ---------- Render ----------
function render(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var items = PRODUCTS.filter(function(p){
    var okCat = activeCat === 'all' || p.category === activeCat;
    var okQ = !q ||
      (p.name || '').toLowerCase().indexOf(q) !== -1 ||
      (p.sku || '').toLowerCase().indexOf(q) !== -1 ||
      (p.ean || '').toLowerCase().indexOf(q) !== -1;
    return okCat && okQ;
  });

  var selCount = Object.keys(selected).length;
  var countEl = document.getElementById('count');
  countEl.innerHTML = '<span>พบ ' + items.length + ' รายการ</span>' +
    (selectMode ? '<span class="sel">เลือกแล้ว ' + selCount + ' รายการ</span>' : '');

  var list = document.getElementById('list');
  if (!items.length) {
    list.innerHTML = '<div class="empty">🔍 ไม่พบสินค้าที่ค้นหา</div>';
  } else {
    list.innerHTML = items.map(function(p){
      var picked = !!selected[p.id];
      var chkHtml = selectMode
        ? '<div class="chk'+(picked?' on':'')+'" onclick="toggleOne(\''+p.id+'\', event)">'+(picked?'✓':'')+'</div>'
        : '';
      var tp = p.typePrices || {};
      return '' +
        '<div class="card'+(picked?' picked':'')+'"'+(selectMode?' onclick="toggleOne(\''+p.id+'\', event)"':'')+'>' +
          '<div class="card-top">' +
            chkHtml +
            '<div class="card-main">' +
              '<div class="name-row">' +
                '<div><div class="name">'+(p.name||'-')+'</div><div class="sku">SKU: '+(p.sku||'-')+' <button class="sku-copy" id="skuCopy-'+p.id+'" onclick="copySku(\''+p.id+'\', event)" title="คัดลอก SKU">📋</button></div></div>' +
                '<div onclick="event.stopPropagation()">' + categorySelectHtml(p) + (p.eol ? '<span class="eol-badge">EOL</span>' : '') + '</div>' +
              '</div>' +
              '<div class="prices">' +
                '<div class="ptag"><div class="lv">S</div><div class="val">'+fmt(tp.S)+'</div></div>' +
                '<div class="ptag"><div class="lv">A</div><div class="val">'+fmt(tp.A)+'</div></div>' +
                '<div class="ptag"><div class="lv">B</div><div class="val">'+fmt(tp.B)+'</div></div>' +
                '<div class="ptag"><div class="lv">Other</div><div class="val">'+fmt(tp.Other)+'</div></div>' +
              '</div>' +
              '<div class="rrp"><span>RRP รวม VAT: <b>'+fmt(p.rrpInVat)+'</b></span><span>Ex VAT: <b>'+fmt(p.rrpExVat)+'</b></span></div>' +
              '<div class="card-foot"><button class="copy-one" id="copyOne-'+p.id+'" onclick="copyOne(\''+p.id+'\', event)">📋 คัดลอกรายการนี้</button></div>' +
            '</div>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  var bar = document.getElementById('bar');
  var main = document.getElementById('mainEl');
  var showBar = selectMode && selCount > 0;
  bar.className = 'bar' + (showBar ? ' show' : '');
  main.className = showBar ? 'has-bar' : '';
  document.getElementById('selCount').textContent = selCount;
}

renderLevelChips();
renderFmtToggle();
checkStoredPin();
</script>
</body>
